[package]
name = "ap01-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bridge"
path = "src/main.rs"

[dependencies]
ap01-bridge-kernel = { path = "../ap01-bridge-kernel" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ap01-gif = { path = "../ap01-gif", features = ["testkit"] }
